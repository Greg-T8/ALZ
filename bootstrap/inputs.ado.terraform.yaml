# -------------------------------------------------------------------------
# Program: azuredevops.terraform.inputs.yaml
# Description: Terraform bootstrap input configuration for Azure DevOps.
# Context: ALZ lab - Azure DevOps bootstrap deployment.
# Author: Greg Tate
# -------------------------------------------------------------------------
# Required Inputs

# This section contains the required inputs to bootstrap the Platform Landing Zone.
# For more detail on these inputs, visit: https://aka.ms/alz/acc/phase0

# For advanced configuration options, any variable available in the bootstrap module can be set in this file.
# You can find them here: https://aka.ms/alz/acc/bootstrap/azuredevops/variables

## Decision 4: Bootstrap Resource Azure Region
bootstrap_location: "westus"

## Decision 6: Parent Management Group
root_parent_management_group_id: "sample-root"

## Decision 7: Platform Subscriptions
subscription_ids:
  management: "11111111-1111-1111-1111-111111111111"
  connectivity: "22222222-2222-2222-2222-222222222222"
  identity: "33333333-3333-3333-3333-333333333333"
  security: "44444444-4444-4444-4444-444444444444"

## Decision 8: Bootstrap Resource Subscription
bootstrap_subscription_id: "55555555-5555-5555-5555-555555555555"

## Decision 9: Bootstrap Resource Naming.
# Default names can be found here: https://aka.ms/alz/acc/bootstrap/azuredevops/resourcenames
# For fully custom naming see the FAQ here: https://aka.ms/alz/acc/faq/bootstrap
service_name: "alz"
environment_name: "mgmt"
postfix_number: 01

## Decision 10: Bootstrap Networking and Agents
use_self_hosted_agents: true
use_private_networking: false

## Decision 11: Version Control System Settings
azure_devops_personal_access_token: ""  # Supplied through TF_VAR_azure_devops_personal_access_token.
azure_devops_agents_personal_access_token: ""  # Supplied through TF_VAR_azure_devops_agents_personal_access_token. Requires the Agent Pools - Read & Manage scope.
azure_devops_organization_name: "sample-organization"
azure_devops_project_name: "sample-alz-project"

apply_approvers: ["sample-approver"]

# Basic Inputs (Do not modify)
iac_type: "terraform"
bootstrap_module_name: "alz_azuredevops"
starter_module_name: "platform_landing_zone"

# Ignore region claims availability support for Azure Container instances
agent_container_zone_support: false

# Use LRS storage account in case ZRS is not available in the bootstrap region.
storage_account_replication_type: "LRS"

# Overrides
resource_names:
  resource_group_state: "rg-alz-mgmt-state-ado"
  resource_group_identity: "rg-alz-mgmt-identity-ado"
  resource_group_agents: "rg-alz-mgmt-agents-ado"
  user_assigned_managed_identity_plan: "id-alz-mgmt-plan"
  user_assigned_managed_identity_apply: "id-alz-mgmt-apply"
  container_instance_01: "aci-alz-mgmt-01"
  container_instance_02: "aci-alz-mgmt-02"

bootstrap_module_version: "v7.3.0"
starter_module_version: "v17.4.0"
upgrade: true

# Auto approve applies only for the bootstrap setup, not the pipeline
auto_approve: true