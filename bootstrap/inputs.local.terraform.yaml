# Required Inputs

# This section contains the required inputs to bootstrap the Platform Landing Zone.
# For more detail on these inputs, visit: https://aka.ms/alz/acc/phase0

# For advanced configuration options, any variable available in the bootstrap module can be set in this file.
# You can find them here: https://aka.ms/alz/acc/bootstrap/local/variables

## Decision 4: Bootstrap Resource Azure Region
bootstrap_location: "eastus"

## Decision 6: Parent Management Group
root_parent_management_group_id: "sample-root"

## Decision 7: Platform Subscriptions
subscription_ids:
  management: "11111111-1111-1111-1111-111111111111"
  connectivity: "22222222-2222-2222-2222-222222222222"
  identity: "33333333-3333-3333-3333-333333333333"
  security: "44444444-4444-4444-4444-444444444444"

## Decision 8: Bootstrap Resource Subscription
bootstrap_subscription_id: "55555555-5555-5555-5555-555555555555"

## Decision 9: Bootstrap Resource Naming
service_name: "alz"
environment_name: "local"
postfix_number: 01

## Decision 10: Local Deployment Settings
# The local bootstrap creates the state resources and managed identities needed for deployment.
create_bootstrap_resources_in_azure: true
storage_account_replication_type: "LRS"

# Basic Inputs (Do not modify)
iac_type: "terraform"
bootstrap_module_name: "alz_local"
starter_module_name: "platform_landing_zone"

# Overrides
resource_names:
  resource_group_state: "rg-alz-mgmt-state-local-01"
  resource_group_identity: "rg-alz-mgmt-identity-local-01"
  user_assigned_managed_identity_plan: "id-alz-mgmt-plan-01"
  user_assigned_managed_identity_apply: "id-alz-mgmt-apply-01"

bootstrap_module_version: "v7.3.0"
starter_module_version: "v17.4.0"
upgrade: true
# auto_approve: true
